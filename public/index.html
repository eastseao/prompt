<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt 库</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #bc8cff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* 顶栏 */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,17,23,.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  .search-box { flex: 1; min-width: 200px; position: relative; }
  .search-box input {
    width: 100%; padding: 8px 12px 8px 34px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: "🔍"; position: absolute; left: 9px; top: 50%;
    transform: translateY(-50%); font-size: 13px; opacity: .6;
  }
  .btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
    cursor: pointer; transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, #238636, #2ea043);
    border-color: #2ea043; color: #fff; font-weight: 600;
  }
  .btn.primary:hover { background: linear-gradient(135deg, #2ea043, #3fb950); }

  /* 主体 */
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }

  .stats {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
    color: var(--muted); font-size: 13px; align-items: center;
  }
  .chip {
    padding: 4px 10px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--border);
    cursor: pointer; transition: .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(88,166,255,.1);
  }

  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    transition: .15s;
  }
  .card:hover { border-color: #484f58; transform: translateY(-2px); }
  .card .title-row { display: flex; align-items: flex-start; gap: 8px; }
  .card h3 { font-size: 15px; flex: 1; word-break: break-all; cursor: pointer; }
  .card h3:hover { color: var(--accent); }
  .star { cursor: pointer; font-size: 16px; user-select: none; }
  .card .content-preview {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    font-family: "Cascadia Code", Consolas, monospace;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    max-height: 100px; overflow: hidden; position: relative;
    white-space: pre-wrap; word-break: break-all;
  }
  .card .content-preview::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0;
    height: 40px; background: linear-gradient(transparent, var(--bg));
  }
  .card .meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  .tag {
    padding: 2px 8px; border-radius: 10px;
    background: rgba(188,140,255,.12); color: var(--accent-2);
    border: 1px solid rgba(188,140,255,.25);
  }
  .cat {
    padding: 2px 8px; border-radius: 10px;
    background: rgba(88,166,255,.12); color: var(--accent);
    border: 1px solid rgba(88,166,255,.25);
  }
  .card .actions { display: flex; gap: 8px; margin-top: auto; }
  .card .actions .btn { padding: 5px 12px; font-size: 12px; flex: 1; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }

  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    grid-column: 1 / -1;
  }
  .empty .big { font-size: 48px; margin-bottom: 12px; }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; width: 100%; max-width: 640px;
    max-height: 90vh; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal h2 { font-size: 18px; }
  .modal label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  .modal input[type=text], .modal textarea, .modal select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 12px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  .modal textarea {
    min-height: 220px; resize: vertical;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 13px;
    line-height: 1.6;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .hint { font-size: 12px; color: var(--muted); }

  /* 查看弹窗 */
  .view-content {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 13px; line-height: 1.7; white-space: pre-wrap;
    word-break: break-all; max-height: 55vh; overflow-y: auto;
  }

  /* toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--panel); border: 1px solid var(--green); color: var(--green);
    padding: 10px 20px; border-radius: 10px; font-size: 14px;
    transition: .3s; z-index: 200; opacity: 0;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { border-color: var(--red); color: var(--red); }

  /* 登录层 */
  #loginMask {
    position: fixed; inset: 0; z-index: 300;
    background: radial-gradient(ellipse at top, #1a2233 0%, var(--bg) 70%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #loginMask.hidden { display: none; }
  .login-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 16px; text-align: center;
  }
  .login-card .logo { font-size: 28px; justify-content: center; display: flex; }
  .login-card p { color: var(--muted); font-size: 13px; }
  .login-card input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-size: 16px; outline: none; text-align: center;
    letter-spacing: 2px;
  }
  .login-card input:focus { border-color: var(--accent); }

  .loading { text-align: center; color: var(--muted); padding: 60px; grid-column: 1/-1; }

  @media (max-width: 600px) {
    .row2 { grid-template-columns: 1fr; }
    header { padding: 12px 14px; }
    main { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">✦ Prompt 库</div>
  <div class="search-box">
    <input id="search" type="text" placeholder="搜索标题 / 内容 / 标签…" />
  </div>
  <select id="sortBy" style="padding:8px;border-radius:8px;background:var(--panel);border:1px solid var(--border);color:var(--text);outline:none;font-size:13px;">
    <option value="new">最新</option>
    <option value="old">最早</option>
    <option value="title">标题</option>
    <option value="fav">收藏优先</option>
  </select>
  <button class="btn primary" onclick="openEditor()">＋ 添加 Prompt</button>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid">
    <div class="loading">加载中…</div>
  </div>
</main>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h2 id="editTitle">添加 Prompt</h2>
    <div>
      <label>标题 *</label>
      <input type="text" id="f_title" placeholder="例如：代码审查专家" maxlength="200">
    </div>
    <div class="row2">
      <div>
        <label>分类</label>
        <input type="text" id="f_category" placeholder="例如：写作 / 编程" maxlength="50" list="catList">
        <datalist id="catList"></datalist>
      </div>
      <div>
        <label>标签（逗号分隔）</label>
        <input type="text" id="f_tags" placeholder="例如：GPT, 实用" maxlength="200">
      </div>
    </div>
    <div>
      <label>Prompt 内容 *</label>
      <textarea id="f_content" placeholder="把 Prompt 粘贴到这里…"></textarea>
    </div>
    <div class="hint">💾 保存后会自动同步到 GitHub 仓库 eastseao/prompt</div>
    <div class="footer">
      <button class="btn" onclick="closeEditor()">取消</button>
      <button class="btn primary" id="saveBtn" onclick="savePrompt()">保存</button>
    </div>
  </div>
</div>

<!-- 查看弹窗 -->
<div class="modal-mask" id="viewMask">
  <div class="modal">
    <div style="display:flex;align-items:center;gap:10px;">
      <h2 id="v_title" style="flex:1;"></h2>
      <button class="star" id="v_star" onclick="toggleFavView()">☆</button>
    </div>
    <div class="meta" id="v_meta"></div>
    <div class="view-content" id="v_content"></div>
    <div class="footer">
      <button class="btn" onclick="closeView()">关闭</button>
      <button class="btn" onclick="copyView()">📋 复制</button>
      <button class="btn" onclick="editFromView()">✏️ 编辑</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 登录层 -->
<div id="loginMask">
  <div class="login-card">
    <div class="logo">✦ Prompt 库</div>
    <p>私有库，请输入访问密码</p>
    <input type="password" id="loginPw" placeholder="访问密码" autocomplete="current-password">
    <button class="btn primary" id="loginBtn" onclick="doLogin()" style="padding:12px;font-size:15px;">进入</button>
    <p class="hint">🔒 密码错误 5 次将锁定 10 分钟</p>
  </div>
</div>

<script>
let prompts = [];
let currentViewId = null;
let editingId = null;

const $ = id => document.getElementById(id);

// ---- 登录 ----
async function doLogin() {
  const pw = $('loginPw').value;
  if (!pw) return toast('请输入密码', true);
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = '验证中…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '登录失败');
    enterApp();
  } catch (e) {
    toast(e.message, true);
    $('loginPw').value = '';
    $('loginPw').focus();
  } finally {
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = '进入';
  }
}

function enterApp() {
  $('loginMask').classList.add('hidden');
  load();
}

async function checkAuth() {
  try {
    const r = await fetch('/api/prompts');
    if (r.ok) { enterApp(); return; }
    if (r.status === 401) {
      $('loginMask').classList.remove('hidden');
      setTimeout(() => $('loginPw').focus(), 50);
    }
  } catch (e) {
    $('grid').innerHTML = `<div class="empty"><div class="big">⚠️</div>连接失败</div>`;
  }
}

async function load() {
  try {
    const r = await fetch('/api/prompts');
    if (r.status === 401) {
      $('loginMask').classList.remove('hidden');
      return;
    }
    const data = await r.json();
    prompts = data.prompts || [];
    render();
  } catch (e) {
    $('grid').innerHTML = `<div class="empty"><div class="big">⚠️</div>加载失败：${esc(e.message)}</div>`;
  }
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const sort = $('sortBy').value;
  let list = prompts.filter(p =>
    !q || p.title.toLowerCase().includes(q)
    || p.content.toLowerCase().includes(q)
    || (p.tags || []).some(t => t.toLowerCase().includes(q))
    || (p.category || '').toLowerCase().includes(q)
  );
  if (sort === 'new') list.sort((a, b) => b.createdAt - a.createdAt);
  else if (sort === 'old') list.sort((a, b) => a.createdAt - b.createdAt);
  else if (sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
  else if (sort === 'fav') list.sort((a, b) => (b.favorite - a.favorite) || (b.createdAt - a.createdAt));

  renderStats();
  const grid = $('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="big">✨</div>${q ? '没有匹配的 Prompt' : '还没有 Prompt，点击右上角「＋ 添加 Prompt」开始吧'}</div>`;
    return;
  }
  grid.innerHTML = list.map(p => cardHTML(p)).join('');
}

function renderStats() {
  const cats = {};
  prompts.forEach(p => { const c = p.category || '未分类'; cats[c] = (cats[c] || 0) + 1; });
  const total = prompts.length;
  const fav = prompts.filter(p => p.favorite).length;
  let html = `<span>共 <b style="color:var(--text)">${total}</b> 条 · 收藏 ${fav} 条</span>`;
  if (total) {
    html += Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 8)
      .map(([c, n]) => `<span class="chip" onclick="filterCat('${esc(c)}')">${esc(c)} ${n}</span>`).join('');
  }
  $('stats').innerHTML = html;
  // datalist
  $('catList').innerHTML = Object.keys(cats).map(c => `<option value="${esc(c)}">`).join('');
}

function cardHTML(p) {
  const preview = p.content.length > 300 ? p.content.slice(0, 300) + '…' : p.content;
  const date = new Date(p.createdAt).toLocaleDateString('zh-CN');
  return `
  <div class="card">
    <div class="title-row">
      <h3 onclick="viewPrompt('${p.id}')">${esc(p.title)}</h3>
      <span class="star" onclick="toggleFav('${p.id}')">${p.favorite ? '★' : '☆'}</span>
    </div>
    <div class="content-preview" onclick="viewPrompt('${p.id}')">${esc(preview)}</div>
    <div class="meta">
      ${p.category ? `<span class="cat">${esc(p.category)}</span>` : ''}
      ${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
      <span style="margin-left:auto">${date}</span>
    </div>
    <div class="actions">
      <button class="btn" onclick="copyPrompt('${p.id}')">📋 复制</button>
      <button class="btn" onclick="editPrompt('${p.id}')">✏️ 编辑</button>
      <button class="btn danger" onclick="delPrompt('${p.id}')">🗑</button>
    </div>
  </div>`;
}

// ---- 编辑 ----
function openEditor() {
  editingId = null;
  $('editTitle').textContent = '添加 Prompt';
  $('f_title').value = ''; $('f_category').value = ''; $('f_tags').value = ''; $('f_content').value = '';
  $('editMask').classList.add('show');
  setTimeout(() => $('f_title').focus(), 50);
}

function editPrompt(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  $('editTitle').textContent = '编辑 Prompt';
  $('f_title').value = p.title;
  $('f_category').value = p.category || '';
  $('f_tags').value = (p.tags || []).join(', ');
  $('f_content').value = p.content;
  $('viewMask').classList.remove('show');
  $('editMask').classList.add('show');
}

function editFromView() { editPrompt(currentViewId); }

function closeEditor() { $('editMask').classList.remove('show'); }

async function savePrompt() {
  const title = $('f_title').value.trim();
  const content = $('f_content').value.trim();
  if (!title || !content) return toast('标题和内容必填', true);
  const body = {
    title, content,
    category: $('f_category').value.trim(),
    tags: $('f_tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
  };
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = '保存中…';
  try {
    const url = editingId ? `/api/prompts/${editingId}` : '/api/prompts';
    const r = await fetch(url, {
      method: editingId ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '保存失败');
    closeEditor();
    toast('✅ 已保存并同步到 GitHub');
    load();
  } catch (e) {
    toast(e.message, true);
  } finally {
    $('saveBtn').disabled = false;
    $('saveBtn').textContent = '保存';
  }
}

// ---- 查看 ----
function viewPrompt(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  currentViewId = id;
  $('v_title').textContent = p.title;
  $('v_star').textContent = p.favorite ? '★' : '☆';
  const date = new Date(p.createdAt).toLocaleString('zh-CN');
  const tags = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join(' ');
  $('v_meta').innerHTML = `${p.category ? `<span class="cat">${esc(p.category)}</span>` : ''} ${tags} <span>· ${date}</span>`;
  $('v_content').textContent = p.content;
  $('viewMask').classList.add('show');
}
function closeView() { $('viewMask').classList.remove('show'); }

function toggleFavView() { toggleFav(currentViewId, true); }

async function toggleFav(id, fromView) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  p.favorite = !p.favorite;
  try {
    await fetch(`/api/prompts/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ favorite: p.favorite }),
    });
    if (fromView) $('v_star').textContent = p.favorite ? '★' : '☆';
    render();
  } catch (e) { toast(e.message, true); }
}

async function delPrompt(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`确定删除「${p.title}」吗？`)) return;
  try {
    const r = await fetch(`/api/prompts/${id}`, { method: 'DELETE' });
    if (!r.ok) throw new Error('删除失败');
    toast('🗑 已删除');
    load();
  } catch (e) { toast(e.message, true); }
}

async function copyPrompt(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  try { await navigator.clipboard.writeText(p.content); toast('📋 已复制到剪贴板'); }
  catch { toast('复制失败', true); }
}

function copyView() { copyPrompt(currentViewId); }

function filterCat(c) {
  $('search').value = c;
  render();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = isErr ? 'err show' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

$('search').addEventListener('input', render);
$('sortBy').addEventListener('change', render);
$('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('editMask').addEventListener('click', e => { if (e.target === $('editMask')) closeEditor(); });
$('viewMask').addEventListener('click', e => { if (e.target === $('viewMask')) closeView(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeEditor(); closeView(); }
  if (e.ctrlKey && e.key === 'Enter' && $('editMask').classList.contains('show')) savePrompt();
});

checkAuth();
</script>
</body>
</html>
